server:
  addr: ":18082"
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 30s
  shutdown_timeout: 10s

database:
  host: "127.0.0.1"
  port: 15440
  user: "lijiaoqiao"
  password: "secret"
  database: "supply_devtest"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h
  conn_max_idle_time: 10m

redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0
  pool_size: 10

token:
  secret_key: "devtest-secret-key-12345678901234567890"
  issuer: "lijiaoqiao/supply-api"
  access_token_ttl: 1h
  refresh_token_ttl: 168h
  revocation_cache_ttl: 30s

audit:
  buffer_size: 1000
  flush_interval: 5s
  export_timeout: 30s